name: Firmware build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Skip if firmware/ vacío
        id: check
        run: |
          if [ ! -f firmware/platformio.ini ]; then
            echo "no_pio=true" >> "$GITHUB_OUTPUT"
            echo "::notice::firmware/platformio.ini no existe todavía. Se rellena en M2."
          fi

      - name: Setup Python
        if: steps.check.outputs.no_pio != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache PlatformIO
        if: steps.check.outputs.no_pio != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        if: steps.check.outputs.no_pio != 'true'
        run: pip install -U platformio

      - name: Build
        if: steps.check.outputs.no_pio != 'true'
        working-directory: firmware
        run: pio run

      - name: Run unit tests
        if: steps.check.outputs.no_pio != 'true'
        working-directory: firmware
        run: pio test -e native || true # cuando exista entorno native, quitar `|| true`

      - name: Upload firmware artifact
        if: steps.check.outputs.no_pio != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/**/*.bin
            firmware/.pio/build/**/*.elf
            firmware/.pio/build/**/*.map
          if-no-files-found: warn
