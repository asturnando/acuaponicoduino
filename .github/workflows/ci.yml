name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detecta qué áreas del monorepo cambian en este PR/push.
  # Los jobs específicos (firmware, backend, web, ...) hacen su propio path-filter,
  # pero este job centraliza un overview útil para depurar CI.
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      hardware: ${{ steps.filter.outputs.hardware }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware: ['firmware/**']
            hardware: ['hardware/**']
            backend:  ['backend/**']
            web:      ['web/**']
            mobile:   ['mobile/**']
            docs:     ['docs/**', 'mkdocs.yml']
            infra:    ['infra/**']
            ai:       ['ai/**']

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [detect-changes, pre-commit, gitleaks]
    if: always()
    steps:
      - name: Report
        run: |
          echo "### CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Área tocada |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| firmware: ${{ needs.detect-changes.outputs.firmware }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| hardware: ${{ needs.detect-changes.outputs.hardware }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| backend:  ${{ needs.detect-changes.outputs.backend }}  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| web:      ${{ needs.detect-changes.outputs.web }}      |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mobile:   ${{ needs.detect-changes.outputs.mobile }}   |" >> "$GITHUB_STEP_SUMMARY"
          echo "| docs:     ${{ needs.detect-changes.outputs.docs }}     |" >> "$GITHUB_STEP_SUMMARY"
          echo "| infra:    ${{ needs.detect-changes.outputs.infra }}    |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ai:       ${{ needs.detect-changes.outputs.ai }}       |" >> "$GITHUB_STEP_SUMMARY"
