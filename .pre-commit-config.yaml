# Pre-commit hooks. Instalar con `pip install pre-commit && pre-commit install`.
# Cada subproyecto puede añadir hooks adicionales en su propia config local.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------
  # Higiene básica
  # ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(kicad_pcb|kicad_sch|kicad_pro|kicad_sym|kicad_mod)$
      - id: end-of-file-fixer
        exclude: \.(kicad_pcb|kicad_sch|kicad_pro|kicad_sym|kicad_mod)$
      - id: check-yaml
        # --unsafe permite tags Python custom (necesario para mkdocs.yml con
        # !!python/name:material.extensions.emoji.twemoji)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------
  # Secretos
  # ---------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------
  # Python (backend, ai, scripts)
  # ---------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^(backend|ai|scripts)/.*\.py$
        additional_dependencies:
          - pydantic
          - sqlalchemy
          - types-requests
          - types-redis

  # ---------------------------------------------------------------
  # JS / TS / MD / YAML (web, mobile, docs)
  # ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, css, scss]
        # Markdown excluido vía .prettierignore (prettier rompe sintaxis mkdocs-material)

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: ^(web|mobile)/.*\.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@9.17.0

  # ---------------------------------------------------------------
  # Markdown
  # ---------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        # Reglas configuradas en .markdownlint.json (la mayoría de cosméticas
        # están off porque chocan con admonitions/grid cards de mkdocs-material).
        exclude: ^docs/adr/template\.md$

  # ---------------------------------------------------------------
  # Shell
  # ---------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ---------------------------------------------------------------
  # Conventional Commits
  # ---------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - hw
          - fw
